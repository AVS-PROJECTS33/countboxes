<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Box Guesser Counter</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>Box Guesser</h1>
      <div id="status" class="status ready">Listo para iniciar</div>
    </header>

    <main class="main-content">
      <div class="video-container">
        <!-- El video es visible por debajo para que iOS no lo congele -->
        <video id="videoInput" autoplay playsinline muted></video>
        <!-- Canvas superpuesto donde pintamos el escaneo -->
        <canvas id="canvasOutput"></canvas>
      </div>
      
      <div class="counter-display">
        <span class="counter-label">Cajas Estimadas</span>
        <div id="boxCount">0</div>
      </div>
      
      <div class="controls">
        <button id="startBtn">Iniciar Cámara</button>
        <button id="calibrateBtn" disabled>Calibrar</button>
        <button id="resetBtn" disabled>Reiniciar</button>
      </div>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
